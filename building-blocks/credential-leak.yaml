# Building block: a credential/secret is found exposed publicly
#
# Premise: someone discovers a live credential (API key, database
# password, signing secret, etc.) sitting in a public place — a public
# repo, a pasted log, a public support ticket. The first decisions are
# about verification/containment (is it actually live, and how fast can
# it be revoked) before the conversation turns to whether it was actually
# used maliciously.
#
# Suggested audience range: technical (revocation/rotation mechanics,
# checking access logs) through exec (extend `node-bb-leak-confirmed-used`
# with disclosure/regulatory branches, similar in spirit to
# scenarios/exec-ransomware-crisis.yaml).
#
# Grafting points (nodes with no branches — extend these):
#   - node-bb-leak-contained       — credential revoked, no evidence of
#                                    misuse found yet; extend with
#                                    monitoring/verification/close-out steps
#   - node-bb-leak-confirmed-used  — evidence found that the credential was
#                                    actually used by someone else; extend
#                                    with a breach-response/disclosure fork
#
# Remember to rename these node ids before splicing into a scenario that
# already has nodes with the same ids (e.g. if using more than one block).

nodes:
  - id: node-bb-leak-report
    title: A live credential is found exposed publicly
    inject: >
      Someone reports finding what looks like a live API key/credential
      in a public location (e.g. committed to a public repository, pasted
      in a public forum or support ticket). It's not yet confirmed whether
      the credential is still active or what it grants access to.
    facilitator_notes: >
      First fork: do participants treat "is it actually still valid" as
      the first question to answer, or jump straight to revoking it? Both
      are defensible — revoking fast is usually safe even before
      confirming validity — but note which order the group reaches for.
    branches:
      - label: Revoke/rotate the credential immediately, then investigate scope
        next: node-bb-leak-revoked
      - label: First confirm what the credential grants access to and whether it's still valid
        next: node-bb-leak-scoping

  - id: node-bb-leak-scoping
    title: Scoping what the credential can access
    inject: >
      The credential is confirmed to still be valid and grants access to
      a system with real customer or business data. It has been exposed
      publicly for an unknown period of time before being noticed.
    facilitator_notes: >
      Note the "unknown period of time" — a common trap here is treating
      the discovery moment as the start of the exposure window when
      investigating, rather than checking how long it was actually
      public for (e.g. how long it's been in the repo's history).
    branches:
      - label: Revoke/rotate the credential now, given the confirmed scope
        next: node-bb-leak-revoked
      - label: Delay revocation slightly to first check access logs for suspicious activity
        next: node-bb-leak-delayed-revocation

  - id: node-bb-leak-delayed-revocation
    title: Still exposed while logs are checked
    inject: >
      Access logs are being reviewed for suspicious activity while the
      credential remains valid and still publicly exposed. This takes
      longer than expected because the logging doesn't clearly distinguish
      legitimate internal use from external use of the same credential.
    facilitator_notes: >
      A deliberate "cost of delay" node — the credential stayed valid and
      exposed for longer than necessary while log analysis that could have
      happened after revocation was done before it. Good debrief material
      on why revocation and investigation don't need to be sequential.
    branches:
      - label: Revoke/rotate the credential now regardless of what the logs show so far
        next: node-bb-leak-revoked

  - id: node-bb-leak-revoked
    title: Credential revoked, scope of use still being checked
    inject: >
      The credential has been revoked/rotated. Access logs are now being
      checked for any use of it by parties other than expected internal
      systems, covering the period it was known to be publicly exposed.
    facilitator_notes: >
      This is the branch point between the two endings — extend with an
      inject revealing whichever direction fits the scenario you're
      building: either no evidence of misuse (-> node-bb-leak-contained)
      or clear evidence of external use (-> node-bb-leak-confirmed-used).
    branches:
      - label: No evidence of use by anyone other than expected internal systems
        next: node-bb-leak-contained
      - label: Evidence found that the credential was used by an unrecognised external source
        next: node-bb-leak-confirmed-used

  - id: node-bb-leak-contained
    title: No evidence of misuse found
    inject: >
      The credential has been revoked and access logs show no use by any
      unrecognised source during the exposure window.
    facilitator_notes: >
      Grafting point — extend with close-out steps appropriate to your
      audience: what gets written up, whether this needs disclosing
      anywhere even without confirmed misuse, and what changes to prevent
      recurrence (secret scanning, rotation policy, etc).

  - id: node-bb-leak-confirmed-used
    title: The credential was used by someone else
    inject: >
      Access logs show requests from an unrecognised source using the
      leaked credential during the exposure window, before it was revoked.
      The extent of what was accessed or changed is not yet fully known.
    facilitator_notes: >
      Grafting point — extend with a breach-response fork appropriate to
      your audience: for exec-tier, this is where disclosure/regulatory/
      comms decisions belong; for technical/management tiers, focus on
      scoping the actual impact and containment.
